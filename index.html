<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Flight Route Planner</title>
<style>
  :root {
    --ink: #111827; --muted: #6b7280; --line: #e5e7eb;
    --accent: #4338ca; --accent-soft: #eef2ff; --surface: #ffffff; --page: #f3f4f6;
    --danger: #b91c1c; --danger-soft: #fef2f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 16px; background: var(--page); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    max-width: 680px; margin: 0 auto; background: var(--surface);
    padding: 36px 32px; border-radius: 14px; box-shadow: 0 10px 30px rgba(17,24,39,.08);
  }
  h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.02em; text-align: center; }
  .subtitle { margin: 0 0 28px; text-align: center; color: var(--muted); font-size: 14px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-top: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; }
  input, select {
    width: 100%; padding: 10px 12px; font-size: 16px; font-family: inherit;
    border: 1px solid #d1d5db; border-radius: 8px; background: #fff; color: var(--ink);
  }
  input { text-transform: uppercase; letter-spacing: .12em; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  button {
    flex: 1 1 160px; padding: 11px 18px; font-size: 15px; font-weight: 600; font-family: inherit;
    color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #3730a3; }
  button:disabled { background: #9ca3af; cursor: default; }
  .error {
    margin-top: 20px; padding: 12px 14px; font-size: 14px;
    background: var(--danger-soft); border: 1px solid #fecaca; color: var(--danger); border-radius: 8px;
  }
  .results { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
  .route { padding: 16px; border-radius: 10px; background: #f9fafb; margin-bottom: 14px; }
  .route.best { background: var(--accent-soft); border: 1px solid #c7d2fe; }
  .route-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .route-path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17px; font-weight: 700; }
  .route-total { font-size: 14px; font-weight: 600; color: var(--accent); white-space: nowrap; }
  .route-stops { font-size: 12px; color: var(--muted); margin: 4px 0 10px; }
  .leg { display: flex; justify-content: space-between; font-size: 13px; color: #4b5563; padding: 2px 0; }
  .leg span:first-child { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .footnote { margin: 30px 0 0; font-size: 12px; color: #9ca3af; text-align: center; line-height: 1.6; }
  .hidden { display: none; }
  @media (max-width: 520px) { .fields { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="card">
  <h1>Global Flight Route Planner</h1>
  <p class="subtitle" id="networkLine">Loading the route network...</p>

  <div class="fields">
    <div>
      <label for="departureCode">Departure (IATA)</label>
      <input type="text" id="departureCode" maxlength="3" placeholder="BNA">
    </div>
    <div>
      <label for="arrivalCode">Arrival (IATA)</label>
      <input type="text" id="arrivalCode" maxlength="3" placeholder="KTM">
    </div>
  </div>

  <div class="controls">
    <div style="flex:0 0 auto">
      <label for="metric">Minimise</label>
      <select id="metric">
        <option value="distance">Total distance</option>
        <option value="hops">Number of stops</option>
      </select>
    </div>
    <div style="flex:0 0 auto">
      <label for="k">Itineraries</label>
      <select id="k"><option>1</option><option>2</option><option selected>3</option><option>5</option></select>
    </div>
    <button id="planRouteButton">Find routes</button>
  </div>

  <div id="errorMessage" class="error hidden"></div>
  <div id="resultsArea" class="results hidden"></div>

  <p class="footnote">
    Airports from OurAirports, route pairs from OpenFlights. The network is treated as
    undirected and distances are great-circle, not flown track miles.
  </p>
</div>

<script>
const $ = (id) => document.getElementById(id);
const button = $('planRouteButton');
const errorBox = $('errorMessage');
const results = $('resultsArea');
const fmt = (n) => n.toLocaleString('en-US', { maximumFractionDigits: 0 });

async function loadSummary() {
  try {
    const s = await (await fetch('/api/summary')).json();
    $('networkLine').textContent =
      `${fmt(s.airports)} airports, ${fmt(s.routes)} routes, ` +
      `largest connected component ${fmt(s.largest_component)} airports`;
  } catch {
    $('networkLine').textContent = 'Start the server with:  python main.py --serve';
  }
}

function showError(message) {
  errorBox.textContent = message;
  errorBox.classList.remove('hidden');
  results.classList.add('hidden');
}

function renderRoutes(routes) {
  errorBox.classList.add('hidden');
  results.innerHTML = routes.map((route, i) => {
    const legs = route.legs.map((l) =>
      `<div class="leg"><span>${l.from} &rarr; ${l.to}</span><span>${fmt(l.km)} km</span></div>`
    ).join('');
    const stops = route.segments === 1
      ? 'non-stop'
      : `${route.segments - 1} stop${route.segments > 2 ? 's' : ''}`;
    return `<div class="route${i === 0 ? ' best' : ''}">
        <div class="route-head">
          <span class="route-path">${route.path.join(' → ')}</span>
          <span class="route-total">${fmt(route.total_km)} km</span>
        </div>
        <div class="route-stops">${stops}</div>
        ${legs}
      </div>`;
  }).join('');
  results.classList.remove('hidden');
}

async function planRoute() {
  const from = $('departureCode').value.trim().toUpperCase();
  const to = $('arrivalCode').value.trim().toUpperCase();
  if (from.length !== 3 || to.length !== 3) return showError('Enter two three-letter IATA codes.');
  if (from === to) return showError('Origin and destination are the same airport.');

  button.disabled = true;
  button.textContent = 'Searching...';
  try {
    const params = new URLSearchParams({ from, to, metric: $('metric').value, k: $('k').value });
    const data = await (await fetch('/api/route?' + params)).json();
    if (data.error) showError(data.error); else renderRoutes(data.routes);
  } catch {
    showError('Could not reach the server. Start it with:  python main.py --serve');
  } finally {
    button.disabled = false;
    button.textContent = 'Find routes';
  }
}

button.addEventListener('click', planRoute);
for (const id of ['departureCode', 'arrivalCode']) {
  $(id).addEventListener('input', (e) => { e.target.value = e.target.value.toUpperCase(); });
  $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') planRoute(); });
}
loadSummary();
</script>
</body>
</html>
